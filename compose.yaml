services:
  postgres:
    image: postgres:18-alpine
    container_name: finops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finops}
      POSTGRES_USER: ${POSTGRES_USER:-finops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finops_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finops-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  finops-postgres-data:
